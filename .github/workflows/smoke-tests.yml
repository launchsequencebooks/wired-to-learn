name: smoke-tests
on:
  push:
  pull_request:
  schedule:
    - cron: "0 6 1 * *"     # monthly: catch breaking changes in new library versions
jobs:
  numpy-chapters:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-parts-1-2.txt
      - run: python tests/smoke_test.py
